name: Deploy to Kody
# Deploys the Kody packages after CI is green on main.
# Real deploys run only when the repository variable KODY_DEPLOY_ENABLED is "true".
# Otherwise (and for a manual run with dry_run) the job only stages the
# packages and runs the Kody publish checks (packageCheck), which save nothing.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only stage and check, do not push or publish"
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: deploy-kody
  cancel-in-progress: false
env:
  KODY_CLI: "@kodycodes/cli@1.31.4"
jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: kody
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        package: [librus-watch, activities-watch, kradziejka, payments-watch]
    steps:
      - uses: actions/checkout@v5
        with:
          # Deploy exactly the commit that CI tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Decide the mode
        id: mode
        env:
          ENABLED: ${{ vars.KODY_DEPLOY_ENABLED }}
          DRY_INPUT: ${{ github.event.inputs.dry_run }}
        run: |
          if [ "$ENABLED" = "true" ] && [ "$DRY_INPUT" != "true" ]; then
            echo "dry_run=false" >> "$GITHUB_OUTPUT"; echo "Mode: deploy"
          else
            echo "dry_run=true" >> "$GITHUB_OUTPUT"; echo "Mode: dry run (checks only)"
          fi
      - name: Stage the package
        run: node tools/kody-stage/stage.mjs packages/${{ matrix.package }} "$RUNNER_TEMP/stage"
      - name: Check that the token is set
        env:
          KODY_API_TOKEN: ${{ secrets.KODY_DEPLOY_TOKEN }}
        run: |
          if [ -z "$KODY_API_TOKEN" ]; then
            echo "::error::The secret KODY_DEPLOY_TOKEN is not set."; exit 1
          fi
      - name: Run the Kody publish checks (saves nothing)
        env:
          KODY_API_TOKEN: ${{ secrets.KODY_DEPLOY_TOKEN }}
        run: |
          node -e '
            const fs = require("fs"), path = require("path");
            const root = process.argv[1], files = {};
            const walk = (d) => { for (const n of fs.readdirSync(d)) { const p = path.join(d, n);
              fs.statSync(p).isDirectory() ? walk(p) : (files[path.relative(root, p)] = fs.readFileSync(p, "utf8")); } };
            walk(root); fs.writeFileSync(process.argv[2], JSON.stringify({ files }));
          ' "$RUNNER_TEMP/stage" "$RUNNER_TEMP/check.json"
          curl -sS --fail-with-body -X POST https://api.kody.codes/v1/packages/check \
            -H "Authorization: Bearer $KODY_API_TOKEN" -H "Content-Type: application/json" \
            --data @"$RUNNER_TEMP/check.json" -o "$RUNNER_TEMP/check-result.json"
          jq '{ok, package_name, checks: [.checks[] | {kind, ok, message}]}' "$RUNNER_TEMP/check-result.json"
          jq -e '.ok == true' "$RUNNER_TEMP/check-result.json" > /dev/null
      - name: Push the staged tree to the Kody package repo
        if: steps.mode.outputs.dry_run == 'false'
        env:
          KODY_API_TOKEN: ${{ secrets.KODY_DEPLOY_TOKEN }}
          PKG: "@tomiwu/${{ matrix.package }}"
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          # The HTTP API needs the package UUID in the path, so look it up by name first.
          PKG_ID=$(npx -y "$KODY_CLI" api packageList --params '{}' \
            | jq -r --arg n "$PKG" '.packages[] | select(.name == $n) | .package_id' | head -1)
          if [ -z "$PKG_ID" ]; then echo "::error::Package $PKG not found in Kody"; exit 1; fi
          npx -y "$KODY_CLI" api packageGetGitRemote \
            --params "{\"package_id\":\"$PKG_ID\",\"scope\":\"write\",\"ttl_seconds\":900}" > "$RUNNER_TEMP/remote.json"
          REMOTE=$(jq -r .authenticated_remote "$RUNNER_TEMP/remote.json")
          echo "::add-mask::$REMOTE"
          NAME=$(jq -r .git_author.name "$RUNNER_TEMP/remote.json")
          EMAIL=$(jq -r .git_author.email "$RUNNER_TEMP/remote.json")
          echo "::add-mask::$EMAIL"
          rm "$RUNNER_TEMP/remote.json"
          git clone -q "$REMOTE" "$RUNNER_TEMP/kody-repo" 2>/dev/null
          cd "$RUNNER_TEMP/kody-repo"
          # Replace the tree with the staged package and keep the history (fast-forward push).
          git rm -rq --ignore-unmatch . && rsync -a "$RUNNER_TEMP/stage/" ./
          git add -A
          if git diff --cached --quiet; then echo "No changes for $PKG"; exit 0; fi
          git -c user.name="$NAME" -c user.email="$EMAIL" commit -qm "Deploy from tomiwu/automations ${SHA}"
          git push -q origin HEAD 2>/dev/null
      - name: Publish on Kody
        if: steps.mode.outputs.dry_run == 'false'
        env:
          KODY_API_TOKEN: ${{ secrets.KODY_DEPLOY_TOKEN }}
          PKG: "@tomiwu/${{ matrix.package }}"
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          # When publish exceeds the inline budget, Kody returns status=dispatched
          # with a workflow_id. Poll that run to completion so a later durable
          # failure (for example checks_failed on artifact rebuild) fails this job
          # instead of leaving a green Deploy to Kody run. One re-publish on
          # durable error, because Kody says a re-run repairs missing artifacts.
          set -euo pipefail
          echo "Publishing $PKG (automations SHA $SHA)"
          publish_once() {
            npx -y "$KODY_CLI" package publish "$PKG"
          }
          await_dispatched() {
            local workflow_id="$1"
            local attempt=0
            local max_attempts=90
            local status="" last_error="" enqueued=""
            echo "Publish dispatched; waiting for workflow $workflow_id"
            while [ "$attempt" -lt "$max_attempts" ]; do
              attempt=$((attempt + 1))
              npx -y "$KODY_CLI" api workflowRunList \
                --params "{\"workflow_id\":\"$workflow_id\"}" > "$RUNNER_TEMP/wf.json"
              status=$(jq -r '.workflows[0].status // empty' "$RUNNER_TEMP/wf.json")
              last_error=$(jq -r '.workflows[0].last_error // empty' "$RUNNER_TEMP/wf.json")
              enqueued=$(jq -r '.workflows[0].enqueued_commit // empty' "$RUNNER_TEMP/wf.json")
              echo "poll $attempt/$max_attempts status=${status:-unknown} enqueued_commit=${enqueued:-n/a}"
              case "$status" in
                complete)
                  jq '{id, status, completed_at, enqueued_commit, last_error}' \
                    <(jq '.workflows[0]' "$RUNNER_TEMP/wf.json")
                  return 0
                  ;;
                errored|terminated|cancelled)
                  echo "::error::Kody publish workflow $workflow_id ended with status=$status"
                  if [ -n "$last_error" ]; then
                    echo "::error::last_error=$last_error"
                    printf '%s\n' "$last_error"
                  fi
                  return 1
                  ;;
              esac
              sleep 10
            done
            echo "::error::Timed out waiting for Kody publish workflow $workflow_id"
            jq '.' "$RUNNER_TEMP/wf.json" || true
            return 1
          }
          finish_publish() {
            local out_file="$1"
            local status
            status=$(jq -r '.status // empty' "$out_file")
            jq '{status, published_commit, previous_commit, message, pending_secret_package_approvals, workflow_id}' "$out_file"
            case "$status" in
              published|already_published)
                return 0
                ;;
              dispatched)
                local workflow_id
                workflow_id=$(jq -r '.workflow_id // empty' "$out_file")
                if [ -z "$workflow_id" ]; then
                  echo "::error::Publish returned dispatched without workflow_id"
                  return 1
                fi
                await_dispatched "$workflow_id"
                return $?
                ;;
              *)
                echo "::error::Unexpected publish status=${status:-empty}"
                return 1
                ;;
            esac
          }
          publish_once > "$RUNNER_TEMP/publish.json"
          if finish_publish "$RUNNER_TEMP/publish.json"; then
            exit 0
          fi
          echo "First publish failed after durable handoff or unexpected status; retrying once"
          publish_once > "$RUNNER_TEMP/publish-retry.json"
          finish_publish "$RUNNER_TEMP/publish-retry.json"
