name: Migrate
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "apply: apply the migrations. verify-storage: only read the attachments bucket and its policies (read only)."
        type: choice
        options: [apply, verify-storage]
        default: apply
permissions:
  contents: read
concurrency:
  group: supabase-migrate
  cancel-in-progress: false
jobs:
  apply:
    name: apply Supabase migrations
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Apply the migrations
        if: github.event.inputs.mode != 'verify-storage'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash tools/migrate/apply.sh supabase/migrations
      - name: Verify the attachments bucket (read only)
        if: github.event.inputs.mode == 'verify-storage'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash tools/migrate/verify-storage.sh
